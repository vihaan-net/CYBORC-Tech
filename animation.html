<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Walking Roadside Animation</title>
<style>
  body{
    margin:0;
    background:#0b0f1a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  canvas{
    background:linear-gradient(#87ceeb, #bde0fe);
    border-radius:12px;
  }
</style>
</head>
<body>

<canvas id="c" width="900" height="450"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

let boyX = 50;
let step = 0;

let cars = [
  {x:900, y:260, speed:3, color:"#ff4444"},
  {x:1200, y:300, speed:2, color:"#ffaa00"}
];

// 🌿 Green background
function drawGreenery(){
  ctx.fillStyle = "#3cb371";
  ctx.fillRect(0, 200, c.width, 80);

  // Trees
  for(let i=0;i<6;i++){
    let x = i*160 + 40;
    ctx.fillStyle = "#8b4513";
    ctx.fillRect(x, 150, 12, 40);
    ctx.beginPath();
    ctx.arc(x+6, 140, 30, 0, Math.PI*2);
    ctx.fillStyle = "#228b22";
    ctx.fill();
  }
}

// 🛣️ Road & path
function drawRoad(){
  // Road
  ctx.fillStyle = "#1f2937";
  ctx.fillRect(0, 250, c.width, 100);

  ctx.strokeStyle = "#ffffffaa";
  ctx.setLineDash([20,15]);
  ctx.beginPath();
  ctx.moveTo(0, 300);
  ctx.lineTo(c.width, 300);
  ctx.stroke();
  ctx.setLineDash([]);

  // Side path
  ctx.fillStyle = "#6b7280";
  ctx.fillRect(0, 350, c.width, 50);
}

// 🚗 Cars
function drawCars(){
  cars.forEach(car=>{
    ctx.fillStyle = car.color;
    ctx.fillRect(car.x, car.y, 60, 30);

    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(car.x+12, car.y+30, 8, 0, Math.PI*2);
    ctx.arc(car.x+48, car.y+30, 8, 0, Math.PI*2);
    ctx.fill();

    car.x -= car.speed;
    if(car.x < -80) car.x = c.width + Math.random()*200;
  });
}

// 👦 Boy walking
function drawBoy(x, y, s){
  ctx.strokeStyle = "#000";
  ctx.lineWidth = 3;

  // Head
  ctx.beginPath();
  ctx.arc(x, y-35, 10, 0, Math.PI*2);
  ctx.stroke();

  // Body
  ctx.beginPath();
  ctx.moveTo(x, y-25);
  ctx.lineTo(x, y+15);
  ctx.stroke();

  // Arms
  ctx.beginPath();
  ctx.moveTo(x, y-10);
  ctx.lineTo(x-15*Math.sin(s), y);
  ctx.moveTo(x, y-10);
  ctx.lineTo(x+15*Math.sin(s), y);
  ctx.stroke();

  // Legs
  ctx.beginPath();
  ctx.moveTo(x, y+15);
  ctx.lineTo(x-15*Math.sin(s), y+40);
  ctx.moveTo(x, y+15);
  ctx.lineTo(x+15*Math.sin(s), y+40);
  ctx.stroke();
}

// 🔁 Animation loop
function animate(){
  ctx.clearRect(0,0,c.width,c.height);

  drawGreenery();
  drawRoad();
  drawCars();

  drawBoy(boyX, 340, step);

  boyX += 1.5;
  step += 0.12;
  if(boyX > c.width+20) boyX = -20;

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
